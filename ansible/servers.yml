---
- name: Managing 3 servers
  hosts: servers
  become: true
  vars:
    packages_one:
      - httpd
      - git
      - unzip
    packages_two:
      - apache2
      - git
      - unzip
  tasks:
    - name: Get the current user
      ansible.builtin.command: whoami
      register: loggedin_user

    - name: Get the hostname
      ansible.builtin.command: hostname
      register: server_hostname

    - name: Get the server distribution
      ansible.builtin.debug:
        var: ansible_facts["distribution"]
      register: server_distribution

    - name: Output the current user
      ansible.builtin.debug:
        msg: "Hello {{loggedin_user.stdout}}"

    - name: Output the hostname
      ansible.builtin.debug:
        msg: "Hello {{server_hostname.stdout}}"

    - name: install packages on Amazon linux server
      ansible.builtin.dnf:
        name: "{{item}}"
        state: present
      loop: "{{packages_one}}"
      when: ansible_facts["distribution"] == "Amazon"

    - name: install packages on Ubuntu server
      ansible.builtin.apt:
        name: "{{item}}"
        state: present
      loop: "{{packages_two}}"
      when: ansible_facts["distribution"] == "Ubuntu"
